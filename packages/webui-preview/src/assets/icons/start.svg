<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景（可选，透明） -->
  <rect width="200" height="200" fill="none"/>

  <!-- Windows logo - 四色方块透视布局 -->
  <g filter="url(#shadow)">
    <!-- 左上 - 红色 -->
    <polygon points="18,28 98,18 98,98 18,98" fill="#F25022"/>

    <!-- 右上 - 绿色 -->
    <polygon points="102,18 182,28 182,98 102,98" fill="#7FBA00"/>

    <!-- 左下 - 蓝色 -->
    <polygon points="18,102 98,102 98,182 18,172" fill="#00A4EF"/>

    <!-- 右下 - 黄色 -->
    <polygon points="102,102 182,102 182,172 102,182" fill="#FFB900"/>
  </g>
</svg>